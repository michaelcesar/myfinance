# =============================================================================
# Finance Manager: local stack (personal use, this machine only)
# =============================================================================
#
# Compose project `finance` with three containers on an internal network.
# Start it with `make up` (see the Makefile and README.md).
#
#   postgres   postgres:16-alpine, data in the `postgres-data` volume. Not published.
#   back-end   NestJS API. Applies pending migrations, then starts; if a
#              migration fails the container never becomes healthy and the
#              front-end does not start (`make logs S=back-end`). Not published.
#   front-end  Next.js web app. The ONLY published port, bound to loopback:
#              http://localhost:${APP_PORT:-8080}. The browser calls `/api/*` on
#              the front-end, which rewrites it to http://back-end:3001 (same
#              origin, so the httpOnly refresh cookie works without CORS). The
#              rewrite target is fixed at `next build` (see web/Dockerfile).
#
# Container names are fixed (`postgres`, `back-end`, `front-end`).
# FM_CONTAINER_PREFIX exists only so scripts/ci-local.sh can run a throwaway
# stack next to this one; it stays empty in normal use.
#
# Variables are interpolated from infra/.env (created by scripts/setup.sh from
# .env.example). Each container receives only what it uses: APP_SECRET never
# reaches Postgres and the database password never reaches the front-end.
#
# Without the `127.0.0.1:` prefix Docker would publish on 0.0.0.0 and open the
# firewall, exposing the app and its financial data to the local network.
# Docker logs rotate so a stack that stays up for months cannot fill the disk.
# =============================================================================

name: finance

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-db-uri: &db-uri postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, run scripts/setup.sh (creates infra/.env) or set the variable}@postgres:5432/${POSTGRES_DB:-finance_manager}

services:
  postgres:
    container_name: ${FM_CONTAINER_PREFIX:-}postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, run scripts/setup.sh (creates infra/.env) or set the variable}
      POSTGRES_DB: ${POSTGRES_DB:-finance_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  back-end:
    container_name: ${FM_CONTAINER_PREFIX:-}back-end
    image: finance-back-end:${IMAGE_TAG:-local}
    build:
      context: ../api
      dockerfile: tools/docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    command: ['sh', '-c', 'npm run --silent migration:run:prod && exec node dist/main']
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_SECRET: ${APP_SECRET:?APP_SECRET is missing, run scripts/setup.sh (creates infra/.env) or set the variable}
      FRONTEND_DOMAIN: http://localhost:${APP_PORT:-8080}
      POSTGRES_URI: *db-uri
      TYPEORM_LOG: 'false'
      TYPEORM_SYNC: 'false'
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s
    logging: *logging

  front-end:
    container_name: ${FM_CONTAINER_PREFIX:-}front-end
    image: finance-front-end:${IMAGE_TAG:-local}
    build:
      context: ../web
      args:
        API_URL: http://back-end:3001
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    depends_on:
      back-end:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/entrar',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

volumes:
  postgres-data:
